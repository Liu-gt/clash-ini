[custom]
;不要随意改变关键字，否则会导致出错
;基于ACL4SSR规则修改，精简版（单节点：直连/代理）

;去广告：不支持
;自动测速：支持
;增强中国IP段：支持
;增强国外GFW：支持

;设置规则标志位
;Claude/Anthropic 强制走代理：置顶优先，任何其他列表/规则都抢不走
ruleset=🔒 Claude 固定,[]DOMAIN-SUFFIX,anthropic.com
ruleset=🔒 Claude 固定,[]DOMAIN-SUFFIX,claude.ai
ruleset=🔒 Claude 固定,[]DOMAIN-SUFFIX,claude.com
ruleset=🔒 Claude 固定,[]DOMAIN-SUFFIX,claudeusercontent.com
;Siri / Apple Intelligence 走代理：置顶，必须排在 🍎 苹果服务(默认直连) 和 GEOIP,CN 之前
ruleset=🍏 Siri｜Apple AI,[]DOMAIN,guzzoni.apple.com
ruleset=🍏 Siri｜Apple AI,[]DOMAIN,mask-api.fe.apple-dns.net
ruleset=🍏 Siri｜Apple AI,[]DOMAIN,mask-api.icloud.com
ruleset=🍏 Siri｜Apple AI,[]DOMAIN,mask-t.apple-dns.net
ruleset=🍏 Siri｜Apple AI,[]DOMAIN,mask.apple-dns.net
ruleset=🍏 Siri｜Apple AI,[]DOMAIN-SUFFIX,smoot.apple.com
ruleset=🍏 Siri｜Apple AI,[]DOMAIN-SUFFIX,apple-relay.apple.com
ruleset=🍏 Siri｜Apple AI,[]DOMAIN-SUFFIX,apple-relay.cloudflare.com
ruleset=🍏 Siri｜Apple AI,[]DOMAIN-SUFFIX,apple-relay.fastly-edge.com
ruleset=🍏 Siri｜Apple AI,[]DOMAIN-SUFFIX,apple-relay.mask.apple-dns.net
ruleset=🍏 Siri｜Apple AI,[]DOMAIN-SUFFIX,apple-relay.akamaized.net
ruleset=🍏 Siri｜Apple AI,[]DOMAIN-SUFFIX,cp4.cloudflare.com
ruleset=🍏 Siri｜Apple AI,[]DOMAIN-SUFFIX,gspe1-ssl.ls.apple.com
ruleset=🍏 Siri｜Apple AI,[]DOMAIN-SUFFIX,gateway.icloud.com
ruleset=🍏 Siri｜Apple AI,[]DOMAIN-SUFFIX,ls.apple.com
ruleset=🍏 Siri｜Apple AI,[]DOMAIN-SUFFIX,mask-h2.icloud.com
ruleset=🍏 Siri｜Apple AI,[]DOMAIN-SUFFIX,mask.icloud.com
ruleset=🍏 Siri｜Apple AI,[]DOMAIN-SUFFIX,apps.mzstatic.com
ruleset=🍏 Siri｜Apple AI,[]DOMAIN-KEYWORD,siri
ruleset=🎯 全球直连,https://raw.githubusercontent.com/mphin/ProxyTools/main/rules/LocalAreaNetwork.list
ruleset=📢 谷歌服务,https://raw.githubusercontent.com/mphin/ProxyTools/main/rules/Google.list
ruleset=🤖 AI｜奈飞,https://raw.githubusercontent.com/mphin/ProxyTools/main/rules/OpenaiNetflix.list
ruleset=🎥 国外媒体,https://raw.githubusercontent.com/mphin/ProxyTools/main/rules/ProxyMedia.list
ruleset=📲 电报消息,https://raw.githubusercontent.com/mphin/ProxyTools/main/rules/Telegram.list
ruleset=✈️ 国外常规,https://raw.githubusercontent.com/mphin/ProxyTools/main/rules/ProxyGFWlist.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/mphin/ProxyTools/main/rules/GlobalDirect.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/mphin/ProxyTools/main/rules/Microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/mphin/ProxyTools/main/rules/Apple.list
ruleset=📺 国内媒体,https://raw.githubusercontent.com/mphin/ProxyTools/main/rules/ChinaMedia.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/mphin/ProxyTools/main/rules/GamesPlatform.list
ruleset=📡 IP｜测速,https://raw.githubusercontent.com/mphin/ProxyTools/main/rules/IpinfoSpeedtest.list
ruleset=🐟 漏网之鱼,[]FINAL
;设置规则标志位

;设置分组标志位（仅保留两个组）
custom_proxy_group=🚀 代理节点`select`.*`[]DIRECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT

; 规则组绑定策略（按需调整）
; 注意：策略组名称要跟上面定义的完全一致
; 默认走代理的组
custom_proxy_group=📢 谷歌服务`select`[]🚀 代理节点`[]DIRECT
custom_proxy_group=🤖 AI｜奈飞`select`[]🚀 代理节点`[]DIRECT
custom_proxy_group=🎥 国外媒体`select`[]🚀 代理节点`[]DIRECT
custom_proxy_group=📲 电报消息`select`[]🚀 代理节点`[]DIRECT
custom_proxy_group=✈️ 国外常规`select`[]🚀 代理节点`[]DIRECT

; Claude/Anthropic 专属固定组：只含节点、无 DIRECT 选项（客户端无法误切直连）
custom_proxy_group=🔒 Claude 固定`select`.*

; Siri / Apple Intelligence 专属组：默认代理，可手动切直连
custom_proxy_group=🍏 Siri｜Apple AI`select`[]🚀 代理节点`[]DIRECT

; 默认走直连的组
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 代理节点
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 代理节点
custom_proxy_group=📺 国内媒体`select`[]DIRECT`[]🚀 代理节点
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🚀 代理节点
custom_proxy_group=📡 IP｜测速`select`[]DIRECT`[]🚀 代理节点
custom_proxy_group=🐟 漏网之鱼`select`[]DIRECT`[]🚀 代理节点
;设置分组标志位

enable_rule_generator=true
overwrite_original_rules=true
