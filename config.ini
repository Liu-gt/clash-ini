[custom]
;不要随意改变关键字，否则会导致出错
;基于ACL4SSR规则修改，在线更新版

;去广告：不支持
;自动测速：支持
;微软分流：支持
;苹果分流：支持
;增强中国IP段：支持
;增强国外GFW：支持

